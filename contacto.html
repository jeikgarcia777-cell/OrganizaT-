    <title>Contacto - OrganizaT</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .modal-fondo {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal-contenido {
            background-color: #1a2b4a;
            margin: 5% auto;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            border: 2px solid #4fd1c5;
            position: relative;
        }
        .cerrar {
            color: #4fd1c5;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            margin-top: -5px;
        }
        .cerrar:hover {
            color: white;
        }
        .boton {
            background: linear-gradient(135deg, #4fd1c5, #2a9d8f);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 17px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin: 15px;
        }
        .fila-botones {
            text-align: center;
            margin: 30px 0;
        }
        .fila-contacto {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 40px 0;
        }
        .item-contacto {
            text-align: center;
            color: white;
        }
        .item-contacto a {
            color: #4fd1c5;
            text-decoration: none;
        }
        .imagen-modal {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
        }
        h2 {
            color: #4fd1c5;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
